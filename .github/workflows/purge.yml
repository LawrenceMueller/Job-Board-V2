name: Purge old job listings from db
on:
  schedule:
    - cron: '*/1 * * * *'
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Purge old job listings from db
        run: |
          curl --request POST \
          --url 'https://www.consolejob.com/api/purge' \
          --header 'Authorization: Bearer ${{ secrets.PURGE_API_KEY }}'
