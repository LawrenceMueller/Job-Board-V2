name: Purge Cron
on:
  schedule:
    -cron: '0 0 * * *'
    jobs:
      cron:
        runs-on: ubuntu-latest
        steps:
          - name: Call our API Route to purge db of old job listings
            run: |
            curl --request POST \
            --url 'http://localhost:3000/api/purge' \
            --header 'Authorization: Bearer ${{secrets.YOUR_API_KEY}}'
