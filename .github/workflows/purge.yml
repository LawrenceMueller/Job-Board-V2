name: Purge Cron
on:
  schedule:
    -cron: '*/15 * * * *'
    jobs:
      cron:
        runs-on: ubuntu-latest
        steps:
          - name: Call API Route
            run: |
              curl --request POST \
              --url 'https://www.consolejob.com/api/purge' \
              --header 'Authorization: Bearer ${{ secrets.PURGE_SECRET_KEY }}'
